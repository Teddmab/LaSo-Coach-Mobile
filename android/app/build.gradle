apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute().text.trim(), "../sentry.gradle")

// Override NDK version to use installed NDK 27.0.12077987 (16KB page size compatible)
rootProject.ext.ndkVersion = "27.0.12077987"

// Shorten CMake build path to avoid Windows 260-char limit
// rootProject.buildDir = file("${rootDir}/build")
// buildDir = file("${rootDir}/build/app")

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.afrotouch.lasocoach'
    defaultConfig {
        applicationId 'com.afrotouch.lasocoach'
        // Force minSdkVersion 24 to satisfy Hermes tooling
        minSdkVersion 24
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.1.1"
        
        // react-native-iap removed - no longer needed
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // PRODUCTION: Utiliser le keystore de release
            // Assurez-vous que les variables sont définies dans ~/.gradle/gradle.properties ou android/gradle.properties
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            } else {
                // Fallback to debug for development builds
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Utiliser la config release pour la production
            signingConfig signingConfigs.release
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

// Fix pour l'erreur std::format dans React Native prefabs
// Les prefabs sont téléchargés pendant configureCMake, donc on corrige après configureCMake mais avant buildCMake
// Le fichier se trouve dans: .gradle/caches/*/transforms/*/transformed/react-android-*/prefab/modules/reactnative/include/react/renderer/core/graphicsConversions.h
def fixReactNativePrefabInCache = {
    def gradleCacheDirs = [
        new File(System.getProperty("user.home"), ".gradle/caches"),
        new File("/home/expo/.gradle/caches"),
        new File(System.getenv("HOME") ?: "", ".gradle/caches")
    ]
    
    def gradleCacheDir = gradleCacheDirs.find { it.exists() }
    
    if (!gradleCacheDir || !gradleCacheDir.exists()) {
        def userHome = System.getProperty("user.home") ?: System.getenv("HOME") ?: "/home/expo"
        gradleCacheDir = new File(userHome, ".gradle/caches")
    }
    
    if (!gradleCacheDir || !gradleCacheDir.exists()) {
        println "⚠️ [fix-prefab] Gradle cache directory not found"
        return
    }
    
    println "🔍 [fix-prefab] Searching for graphicsConversions.h in: ${gradleCacheDir.absolutePath}"
    
    def foundFiles = []
    
    // Utiliser find avec plusieurs tentatives et patterns
    try {
        // Pattern 1: Chercher dans transforms (le plus probable)
        def cmd1 = ["sh", "-c", "find '${gradleCacheDir.absolutePath}/transforms' -name 'graphicsConversions.h' -type f 2>/dev/null | head -10"]
        def process1 = cmd1.execute()
        process1.waitFor()
        def result1 = process1.text.trim()
        if (result1) {
            foundFiles.addAll(result1.split('\n').findAll { it && it.length() > 0 })
        }
        
        // Pattern 2: Chercher partout dans le cache
        if (foundFiles.isEmpty()) {
            def cmd2 = ["sh", "-c", "find '${gradleCacheDir.absolutePath}' -name 'graphicsConversions.h' -type f 2>/dev/null | head -10"]
            def process2 = cmd2.execute()
            process2.waitFor()
            def result2 = process2.text.trim()
            if (result2) {
                foundFiles.addAll(result2.split('\n').findAll { it && it.length() > 0 })
            }
        }
        
        // Pattern 3: Chercher spécifiquement dans react-android avec path exact
        if (foundFiles.isEmpty()) {
            def cmd3 = ["sh", "-c", "find '${gradleCacheDir.absolutePath}' -path '*/react-android-*/prefab/modules/reactnative/include/react/renderer/core/graphicsConversions.h' -type f 2>/dev/null | head -10"]
            def process3 = cmd3.execute()
            process3.waitFor()
            def result3 = process3.text.trim()
            if (result3) {
                foundFiles.addAll(result3.split('\n').findAll { it && it.length() > 0 })
            }
        }
        
        // Pattern 4: Chercher dans les sous-dossiers transforms avec wildcard
        if (foundFiles.isEmpty()) {
            def cmd4 = ["sh", "-c", "find '${gradleCacheDir.absolutePath}' -type d -name 'transforms' 2>/dev/null | head -1 | xargs -I {} find {} -name 'graphicsConversions.h' -type f 2>/dev/null | head -10"]
            def process4 = cmd4.execute()
            process4.waitFor()
            def result4 = process4.text.trim()
            if (result4) {
                foundFiles.addAll(result4.split('\n').findAll { it && it.length() > 0 })
            }
        }
    } catch (Exception e) {
        println "⚠️ [fix-prefab] Error during search: ${e.message}"
        e.printStackTrace()
    }
    
    // Dédupliquer
    foundFiles = foundFiles.unique()
    
    // Si on ne trouve rien avec find, essayer de chercher directement dans les dossiers transforms
    if (foundFiles.isEmpty()) {
        println "⚠️ [fix-prefab] No files found with find, trying direct path search..."
        try {
            // Chercher dans les dossiers transforms
            def transformsDir = new File(gradleCacheDir, "transforms")
            if (transformsDir.exists()) {
                transformsDir.eachDir { transformDir ->
                    def transformedDir = new File(transformDir, "transformed")
                    if (transformedDir.exists()) {
                        transformedDir.eachDir { reactAndroidDir ->
                            if (reactAndroidDir.name.startsWith("react-android-")) {
                                def graphicsFile = new File(reactAndroidDir, "prefab/modules/reactnative/include/react/renderer/core/graphicsConversions.h")
                                if (graphicsFile.exists()) {
                                    foundFiles.add(graphicsFile.absolutePath)
                                    println "✅ [fix-prefab] Found file via direct search: ${graphicsFile.absolutePath}"
                                }
                            }
                        }
                    }
                }
            }
        } catch (Exception e) {
            println "⚠️ [fix-prefab] Error in direct search: ${e.message}"
        }
    }
    
    if (foundFiles.isEmpty()) {
        println "⚠️ [fix-prefab] No graphicsConversions.h files found after all search attempts"
        println "🔍 [fix-prefab] Debug: Cache dir exists: ${gradleCacheDir.exists()}, Path: ${gradleCacheDir.absolutePath}"
        return
    }
    
    println "✅ [fix-prefab] Found ${foundFiles.size()} file(s): ${foundFiles.join(', ')}"
    
    def fixedCount = 0
    foundFiles.each { filePath ->
        def file = new File(filePath)
        if (file.exists() && file.isFile()) {
            try {
                def content = file.text
                if (content.contains('std::format("{}%", dimension.value)')) {
                    println "🔧 [fix-prefab] Fixing: ${file.absolutePath}"
                    def fixedContent = content.replace(
                        'return std::format("{}%", dimension.value);',
                        'return std::to_string(dimension.value) + "%";'
                    )
                    file.text = fixedContent
                    fixedCount++
                    println "✅ [fix-prefab] Fixed: ${file.absolutePath}"
                } else if (content.contains('std::to_string(dimension.value) + "%"')) {
                    println "ℹ️ [fix-prefab] Already fixed: ${file.absolutePath}"
                }
            } catch (Exception e) {
                println "⚠️ [fix-prefab] Error fixing ${file.absolutePath}: ${e.message}"
            }
        }
    }
    
    if (fixedCount > 0) {
        println "✅ [fix-prefab] Fixed ${fixedCount} file(s)"
    } else {
        println "ℹ️ [fix-prefab] No files needed fixing (${foundFiles.size()} checked)"
    }
}

// Corriger les fichiers après configureCMake mais avant buildCMake
// S'applique à tous les types de builds (Debug, Release, RelWithDebInfo, etc.)
afterEvaluate {
    tasks.matching { task ->
        task.name.startsWith("configureCMake")
    }.configureEach { configureTask ->
        configureTask.doLast {
            println "🔧 [fix-prefab] Running after ${configureTask.name}"
            fixReactNativePrefabInCache()
        }
    }
    
    // Aussi corriger juste avant buildCMake au cas où
    tasks.matching { task ->
        task.name.startsWith("buildCMake")
    }.configureEach { buildTask ->
        buildTask.doFirst {
            println "🔧 [fix-prefab] Running before ${buildTask.name}"
            fixReactNativePrefabInCache()
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
